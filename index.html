<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE GRAND SANCTUARY | 絢爛たる静寂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- シネマティック・カーテン（入場オープニング演出） -->
  <div class="cinema-curtain cinema-top" id="curtainTop"></div>
  <div class="cinema-curtain cinema-bottom" id="curtainBottom"></div>

  <!-- 神秘的な黄金パーティクル背景 Canvas -->
  <canvas id="bgCanvas" class="bg-canvas"></canvas>

  <!-- 祝杯・紙吹雪 Canvas -->
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <!-- サウンドトグルコントロール (Web Audio API) -->
  <div class="sound-control-wrapper">
    <button class="sound-btn" id="soundBtn" aria-label="サウンド切り替え" title="サウンド切り替え">
      <span class="sound-bars" aria-hidden="true">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </span>
      <span class="sound-label" id="soundLabel">SOUND: OFF</span>
    </button>
  </div>

  <!-- メインコンテンツ -->
  <main class="container">
    <div class="card-perspective">
      <article class="luxury-card" id="luxuryCard">
        <!-- カード表面の動的光沢（グレア） -->
        <div class="card-glare" id="cardGlare"></div>

        <!-- ロイヤル・クレスト（紋章 SVG） -->
        <div class="crest-wrapper">
          <svg class="royal-crest" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffe28a" />
                <stop offset="30%" stop-color="#d4af37" />
                <stop offset="70%" stop-color="#aa771c" />
                <stop offset="100%" stop-color="#ffd700" />
              </linearGradient>
            </defs>
            <!-- 王冠 -->
            <path d="M25 42L35 55L50 32L65 55L75 42L70 65H30L25 42Z" fill="url(#goldGrad)" stroke="#fff" stroke-width="0.8" opacity="0.95" />
            <!-- 月桂樹の葉 (左) -->
            <path d="M22 68C18 60 18 45 28 35C24 45 25 58 32 66" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
            <path d="M16 52C20 50 25 52 27 55" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
            <path d="M14 62C18 61 24 63 26 67" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
            <!-- 月桂樹の葉 (右) -->
            <path d="M78 68C82 60 82 45 72 35C76 45 75 58 68 66" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
            <path d="M84 52C80 50 75 52 73 55" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
            <path d="M86 62C82 61 76 63 74 67" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
            <!-- 中央のダイヤモンド -->
            <polygon points="50,45 57,55 50,65 43,55" fill="#fff" opacity="0.9" />
            <circle cx="50" cy="55" r="1.5" fill="#aa771c" />
          </svg>
          <div class="crest-glow"></div>
        </div>

        <!-- ヘッダー情報 -->
        <p class="tagline">✦ EXCLUSIVE PRIVATE SALON ・ EDITION LIMITÉE ✦</p>

        <!-- メインタイトル -->
        <h1 class="main-title">
          <span class="gold-shimmer">絢爛たる静寂、</span><br>
          <span class="gold-shimmer">選ばれし者だけの極致。</span>
        </h1>

        <!-- 装飾ディバイダー -->
        <div class="luxury-divider" aria-hidden="true">
          <span class="line"></span>
          <span class="diamond">◆</span>
          <span class="line"></span>
        </div>

        <!-- サブメッセージ -->
        <p class="sub-message">
          無駄を極め、贅を尽くしたその先に——。<br>
          全宇宙が息を呑む、アルティメット・プレステージ・エクスペリエンスへようこそ。
        </p>

        <!-- 無駄に過剰なステータスメーター -->
        <div class="metrics-grid">
          <div class="metric-item">
            <span class="metric-label">ラグジュアリー指数</span>
            <span class="metric-val" id="counterLux">0</span>
            <span class="metric-unit">%</span>
          </div>
          <div class="metric-separator" aria-hidden="true"></div>
          <div class="metric-item">
            <span class="metric-label">実用性 (UTILITY)</span>
            <span class="metric-val">0.00</span>
            <span class="metric-unit">%</span>
          </div>
          <div class="metric-separator" aria-hidden="true"></div>
          <div class="metric-item">
            <span class="metric-label">PRESTIGE STATUS</span>
            <span class="metric-val infinity-val">∞</span>
            <span class="metric-unit">MAX</span>
          </div>
        </div>

        <!-- 豪華なインタラクティブボタングループ -->
        <div class="action-buttons">
          <button class="btn btn-gold" id="btnChampagne">
            <span class="btn-shine"></span>
            <span class="btn-icon">🍾</span>
            <span class="btn-text">祝杯を挙げる (CELEBRATE)</span>
          </button>
          <button class="btn btn-outline-gold" id="btnSanctuary">
            <span class="btn-icon">⚜</span>
            <span class="btn-text">聖域の扉を開く (ENTER)</span>
          </button>
        </div>

        <!-- カード下部フッター認証スタンプ -->
        <div class="card-footer-stamp">
          <span>CERTIFIED 999.9 PURE EXTRAVAGANCE</span>
          <span>•</span>
          <span>SERIES NO. 000001</span>
        </div>
      </article>
    </div>
  </main>

  <!-- 聖域の扉を開いたときの神々しいフラッシュオーバーレイ -->
  <div class="sanctuary-flash" id="sanctuaryFlash">
    <div class="flash-content">
      <div class="flash-crest">⚜</div>
      <h2>WELCOME TO THE SANCTUARY</h2>
      <p>至高の領域へ、ようこそ。</p>
      <button class="btn btn-gold btn-close-flash" id="btnCloseFlash">現世へ戻る</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
